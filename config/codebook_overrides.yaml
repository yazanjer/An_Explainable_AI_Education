# ---------------------------------------------------------------------------
# Hand-verified codebook entries for every item the analysis interprets.
#
# The auto-extractor (scripts/build_codebook.py) recovers question stems
# reliably but wraps long item labels. Every item that appears in
# config/predictor_allowlist.yaml, or that is named anywhere in the
# manuscript, is transcribed here BY HAND from the official instrument and
# takes precedence over the auto-extraction.
#
# Source: CY7_201709_QST_MS_STQ_CBA_NoNotes, "PISA 2018 Student Questionnaire
# (Main Survey, computer-based)", OECD. Page numbers are PDF pages.
#
# WHY THIS FILE EXISTS
# The submitted manuscript glossed ST012Q01TA as "number of books in the
# household" (main.tex:433) and as "home book availability" (main.tex:820).
# Both are wrong: ST012Q01TA is the number of TELEVISIONS in the home. The
# books item is ST013Q01TA, which the manuscript in turn glossed as
# "availability of education materials in the home". See CHANGELOG_REVISION.md
# entry CB-1. Nothing in the revised discussion may name a variable without
# resolving it through this file.
# ---------------------------------------------------------------------------

version: "1.0"
verified_by: revision team
verified_against: CY7_201709_QST_MS_STQ_CBA_NoNotes (PDF pages cited per item)

blocks:
  ST011:
    page_pdf: 11
    question_stem: "Which of the following are in your home?"
    instruction: "(Please select one response in each row.)"
    scale_type: binary
    response_categories: {1: "Yes", 2: "No"}
    direction: "1 = present; lower numeric value indicates possession"
  ST012:
    page_pdf: 12
    question_stem: "How many of these are there at your home?"
    instruction: "(Please select one response in each row.)"
    scale_type: ordinal
    response_categories: {1: "None", 2: "One", 3: "Two", 4: "Three or more"}
    direction: "increasing count of the possession"
  ST013:
    page_pdf: 13
    question_stem: "How many books are there in your home?"
    instruction: >
      There are usually about 40 books per metre of shelving. Do not include
      magazines, newspapers, or your schoolbooks. (Please select one response.)
    scale_type: ordinal
    response_categories:
      1: "0-10 books"
      2: "11-25 books"
      3: "26-100 books"
      4: "101-200 books"
      5: "201-500 books"
      6: "More than 500 books"
    direction: "increasing number of books in the home"
  ST004:
    page_pdf: 6
    question_stem: "Are you female or male?"
    instruction: "(Please select one response.)"
    scale_type: nominal
    response_categories: {1: "Female", 2: "Male"}
    direction: "nominal; one-hot encoded"
  ST019:
    page_pdf: 16
    question_stem: "In what country were you and your parents born?"
    instruction: "(Please select one response in each column.)"
    scale_type: nominal
    response_categories_instrument:
      1: "<Country A>"
      2: "<Country B>"
      3: "<Country C>"
      4: "<Country D>"
      5: "<...etc.>"
      6: "Other country"
    coding_note: >
      The released PISA 2018 database recodes this block to
      1 = "Country of test", 2 = "Other country". The authoritative coding is
      the SPSS value-label metadata in CY07_MSU_STU_QQQ.sav, which
      codebook.py merges in when available. Do NOT interpret the raw
      instrument codes above against database values.
    direction: "nominal; one-hot encoded"
  ST166:
    page_pdf: 45
    question_stem: >
      Reading Task. "You have received a message in your inbox from a
      well-known mobile phone operator telling you that you are one of the
      winners of a smartphone. The sender asks you to click on the link to
      fill out a form with your data so they can send you the smartphone."
      In your opinion, how appropriate are the following strategies in
      reaction to this email?
    instruction: "(Please select one response in each row.)"
    scale_type: ordinal
    response_categories:
      1: "Not appropriate at all"
      2: ""
      3: ""
      4: ""
      5: ""
      6: "Very appropriate"
    direction: "increasing judged appropriateness of the strategy"
    construct_note: >
      IMPORTANT. This block is a situational-judgement task on how to react to
      a phishing email, administered within the PISA 2018 reading framework.
      It measures judgement about a specific digital-safety scenario. It is NOT
      a measure of device ownership, internet access, or general digital
      literacy practices. The manuscript's description of this block as
      "presence/absence of devices/internet access/digital literacy practices"
      (main.tex:433) is incorrect. Note also that items Q01HA and Q03HA are
      REVERSE-scored relative to Q02HA, Q04HA and Q05HA: endorsing them
      indicates poorer judgement.

items:
  # --- ST011: home possessions (present in the data, unused by the original paper)
  ST011Q01TA: {block: ST011, label: "A desk to study at"}
  ST011Q02TA: {block: ST011, label: "A room of your own"}
  ST011Q03TA: {block: ST011, label: "A quiet place to study"}
  ST011Q04TA: {block: ST011, label: "A computer you can use for school work"}
  ST011Q05TA: {block: ST011, label: "Educational software"}
  ST011Q06TA: {block: ST011, label: "A link to the Internet"}
  ST011Q07TA: {block: ST011, label: "Classic literature (e.g. <Shakespeare>)"}
  ST011Q08TA: {block: ST011, label: "Books of poetry"}
  ST011Q09TA: {block: ST011, label: "Works of art (e.g. paintings)"}
  ST011Q10TA: {block: ST011, label: "Books to help with your school work"}
  ST011Q11TA: {block: ST011, label: "<Technical reference books>"}
  ST011Q12TA: {block: ST011, label: "A dictionary"}
  ST011Q16NA: {block: ST011, label: "Books on art, music, or design"}

  # --- ST012: household possession COUNTS (used by the original paper)
  ST012Q01TA:
    block: ST012
    label: "Televisions"
    manuscript_error: >
      Glossed as "number of books in the household" at main.tex:433 and as
      "home book availability" at main.tex:820. Both are wrong. This item
      counts televisions.
  ST012Q02TA: {block: ST012, label: "Cars"}
  ST012Q03TA: {block: ST012, label: "Rooms with a bath or shower"}
  ST012Q05NA: {block: ST012, label: "<Cell phones> with Internet access (e.g. smartphones)"}
  ST012Q06NA: {block: ST012, label: "Computers (desktop computer, portable laptop, or notebook)"}
  ST012Q07NA: {block: ST012, label: "<Tablet computers> (e.g. <iPad(R)>, <BlackBerry(R) PlayBook(TM)>)"}
  ST012Q08NA: {block: ST012, label: "E-book readers (e.g. <Kindle(TM)>, <Kobo>, <Bookeen>)"}
  ST012Q09NA: {block: ST012, label: "Musical instruments (e.g. guitar, piano)"}

  # --- ST013: books in the home
  ST013Q01TA:
    block: ST013
    label: "How many books are there in your home?"
    manuscript_error: >
      Glossed as "availability of education materials in the home" at
      main.tex:433. This is the books-in-the-home item, the standard PISA
      proxy for home cultural/educational resources.

  # --- ST004: sex. NOTE the released database variable is ST004D01T (derived),
  # not the questionnaire item code ST004Q01TA. Both are recorded.
  ST004Q01TA: {block: ST004, label: "Are you female or male?"}
  ST004D01T:
    block: ST004
    label: "Student (Standardized) Gender"
    coding_note: >
      Database variable derived from questionnaire item ST004Q01TA.
      Authoritative coding comes from the SPSS value labels in
      CY07_MSU_STU_QQQ.sav (1 = Female, 2 = Male).

  # --- ST019: country of birth (student, mother, father)
  ST019AQ01T: {block: ST019, label: "Country of birth -- You (student)"}
  ST019BQ01T: {block: ST019, label: "Country of birth -- Mother"}
  ST019CQ01T: {block: ST019, label: "Country of birth -- Father"}

  # --- ST166: phishing-email judgement task
  ST166Q01HA:
    block: ST166
    label: "Answer the email and ask for more information about the smartphone"
    reverse_scored: true
  ST166Q02HA:
    block: ST166
    label: "Check the sender's email address"
    reverse_scored: false
  ST166Q03HA:
    block: ST166
    label: "Click on the link to fill out the form as soon as possible"
    reverse_scored: true
  ST166Q04HA:
    block: ST166
    label: "Delete the email without clicking on the link"
    reverse_scored: false
  ST166Q05HA:
    block: ST166
    label: "Check the website of the mobile phone operator to see whether the smartphone offer is mentioned"
    reverse_scored: false

# ---------------------------------------------------------------------------
# Non-questionnaire variables that appear in the data. Recorded here so that
# every column in the dataset has a documented status; NONE of these may be
# used as a predictor (see config/predictor_allowlist.yaml and
# src/vlpso_xai/data/features.py).
# ---------------------------------------------------------------------------
non_questionnaire:
  PV1MATH..PV10MATH:
    role: outcome_source
    description: "Ten plausible values for mathematics proficiency."
    note: "The label is a threshold on these. Forbidden in X."
  PV1READ..PV10READ:
    role: outcome_derived
    description: "Ten plausible values for reading proficiency."
    note: >
      Not the outcome, but drawn from the same conditioning model as the
      mathematics PVs and therefore contaminated with outcome information.
      Forbidden in X.
  PV1SCIE..PV10SCIE:
    role: outcome_derived
    description: "Ten plausible values for science proficiency."
    note: "Same reasoning as the reading PVs. Forbidden in X."
  W_FSTUWT:
    role: design
    description: "Final student weight."
    note: "Design variable. Used for weighting, never as a predictor."
  W_FSTURWT1..W_FSTURWT80:
    role: design
    description: "Fay BRR replicate weights (Fay factor 0.5)."
    note: "Used for variance estimation only."
  SENWT:
    role: design
    description: "Senate weight (each country weighted to 1000)."
  STRATUM:
    role: design
    description: "Explicit sampling stratum."
    note: >
      One-hot encoded and used as a predictor in the original analysis, and
      its top-SHAP value (STRATUM_ESP9033, main.tex:746) was interpreted as a
      substantive regional effect. It is a sampling-design variable. Forbidden.
  CNTSCHID:
    role: identifier_psu
    description: "School identifier; the primary sampling unit."
    note: "Used as the CV grouping variable, never as a predictor."
  CNTSTUID:
    role: identifier
    description: "Student identifier."
  CNT / CNTRYID / CYC / NatCen / SUBNATIO / OECD / VER_DAT / ADMINMODE / LANGTEST:
    role: administrative
    description: "Country, cycle, centre, sub-national region, administration metadata."
  noise_control:
    role: negative_control
    description: "Gaussian N(0,1) noise injected at data_preparation.py:178."
    note: >
      Excluded from the predictor allowlist. Appended at evaluation time to
      diagnostic runs only, as a calibration benchmark for the XAI analysis.
      The original manuscript interpreted it substantively at main.tex:766.
