# ===========================================================================
# CANDIDATE PREDICTOR ALLOWLIST -- PISA 2018 student questionnaire, Spain
#
# This file IS the answer to editor comment 2: "Provide the complete list of
# candidate predictors and explain how variables directly or indirectly
# related to the mathematics score or proficiency category were excluded."
# It is exported verbatim as a supplementary table by
# scripts/make_manuscript_assets.py.
#
# RULES
#  * A column enters the design matrix ONLY if it is named here. This is an
#    allowlist, not a denylist: a new column added upstream cannot silently
#    become a predictor.
#  * Every entry carries the official codebook label and response scale,
#    resolved through config/codebook_overrides.yaml, and a one-line
#    justification. src/vlpso_xai/data/features.py::Allowlist.validate()
#    refuses to load an entry whose justification is blank.
#  * Nothing here may match a pattern in FORBIDDEN_PATTERNS. The loader checks
#    and raises LeakageError on a contradiction.
#  * `single_auc` is filled in by the empirical screen. Anything above 0.95
#    requires an explicit `signed_off_by` before it may be used.
#
# EXCLUDED, AND WHY (these were predictors in the submitted analysis)
#  STRATUM / STRATUM_ESP90xx  sampling stratum. A design variable. The paper's
#                             headline SHAP finding (main.tex:746,
#                             "STRATUM_ESP9033 ... +0.88") was an
#                             interpretation of a sampling artefact.
#  math_score, PV*MATH        the outcome and its source variables.
#  PV*READ, PV*SCIE           same PISA conditioning model as the outcome.
#  W_FSTUWT, W_FSTURWT1..80   survey weights. Used for weighting and variance
#                             estimation, never as features.
#  noise_control              injected Gaussian noise. Retained as a NEGATIVE
#                             CONTROL for the XAI calibration analysis only.
# ===========================================================================

meta:
  version: "1.0"
  cycle: 2018
  country: ESP
  external_country: PRT
  codebook: config/codebook_overrides.yaml
  n_student_items: 30
  note: >
    Item selection follows the five conceptual categories described at
    main.tex:433, corrected against the official instrument. The ST011 block
    is ADDED relative to the submitted analysis: it is the genuine
    home-educational-resources block (desk, quiet place to study, computer for
    schoolwork, internet link, reference books) that the manuscript claimed to
    be using when it was in fact using ST012, a household-possession count
    block whose first item is televisions.

predictors:

  # ---------------------------------------------------------------------
  # (i) Home educational and cultural resources -- ST011 (binary Yes/No)
  #     ADDED in revision. Standard PISA home-resources block.
  # ---------------------------------------------------------------------
  ST011Q01TA:
    block: ST011
    label: "A desk to study at"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Direct measure of a home study environment; standard PISA home-resources indicator."
  ST011Q02TA:
    block: ST011
    label: "A room of your own"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Home space available for independent study."
  ST011Q03TA:
    block: ST011
    label: "A quiet place to study"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Conditions for concentrated study at home."
  ST011Q04TA:
    block: ST011
    label: "A computer you can use for school work"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Access to computing for schoolwork; the substantive digital-access measure."
  ST011Q05TA:
    block: ST011
    label: "Educational software"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Availability of learning-specific software at home."
  ST011Q06TA:
    block: ST011
    label: "A link to the Internet"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Home internet connectivity; a basic access condition."
  ST011Q07TA:
    block: ST011
    label: "Classic literature (e.g. <Shakespeare>)"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Classical cultural-capital indicator in the PISA framework."
  ST011Q08TA:
    block: ST011
    label: "Books of poetry"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Cultural-capital indicator."
  ST011Q09TA:
    block: ST011
    label: "Works of art (e.g. paintings)"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Cultural-capital indicator."
  ST011Q10TA:
    block: ST011
    label: "Books to help with your school work"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Educational-resource availability specific to schoolwork."
  ST011Q11TA:
    block: ST011
    label: "<Technical reference books>"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Educational-resource availability."
  ST011Q12TA:
    block: ST011
    label: "A dictionary"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Basic home educational resource."
  ST011Q16NA:
    block: ST011
    label: "Books on art, music, or design"
    scale: "1 = Yes, 2 = No"
    encoding: ordinal
    justification: "Cultural-capital indicator."

  # ---------------------------------------------------------------------
  # (ii) Household possessions -- ST012 (ordinal counts)
  #      Used in the submitted analysis. Retained, correctly labelled.
  # ---------------------------------------------------------------------
  ST012Q01TA:
    block: ST012
    label: "Televisions"
    scale: "1 = None, 2 = One, 3 = Two, 4 = Three or more"
    encoding: ordinal
    justification: >
      Household-possession count, a component of the PISA family-wealth index.
      NOTE: the submitted manuscript described this item as books in the
      household (main.tex:433, main.tex:820). It counts televisions.
  ST012Q02TA:
    block: ST012
    label: "Cars"
    scale: "1 = None, 2 = One, 3 = Two, 4 = Three or more"
    encoding: ordinal
    justification: "Household-possession count; component of the PISA family-wealth index."
  ST012Q03TA:
    block: ST012
    label: "Rooms with a bath or shower"
    scale: "1 = None, 2 = One, 3 = Two, 4 = Three or more"
    encoding: ordinal
    justification: "Housing-quality indicator; component of the family-wealth index."
  ST012Q05NA:
    block: ST012
    label: "<Cell phones> with Internet access (e.g. smartphones)"
    scale: "1 = None, 2 = One, 3 = Two, 4 = Three or more"
    encoding: ordinal
    justification: "Household digital-device count."
  ST012Q06NA:
    block: ST012
    label: "Computers (desktop computer, portable laptop, or notebook)"
    scale: "1 = None, 2 = One, 3 = Two, 4 = Three or more"
    encoding: ordinal
    justification: "Household computer count; digital-access measure."
  ST012Q07NA:
    block: ST012
    label: "<Tablet computers> (e.g. <iPad(R)>, <BlackBerry(R) PlayBook(TM)>)"
    scale: "1 = None, 2 = One, 3 = Two, 4 = Three or more"
    encoding: ordinal
    justification: "Household digital-device count."
  ST012Q08NA:
    block: ST012
    label: "E-book readers (e.g. <Kindle(TM)>, <Kobo>, <Bookeen>)"
    scale: "1 = None, 2 = One, 3 = Two, 4 = Three or more"
    encoding: ordinal
    justification: "Household digital-reading-device count."
  ST012Q09NA:
    block: ST012
    label: "Musical instruments (e.g. guitar, piano)"
    scale: "1 = None, 2 = One, 3 = Two, 4 = Three or more"
    encoding: ordinal
    justification: "Cultural-capital indicator within the possessions block."

  # ---------------------------------------------------------------------
  # (iii) Books in the home -- ST013
  # ---------------------------------------------------------------------
  ST013Q01TA:
    block: ST013
    label: "How many books are there in your home?"
    scale: "1 = 0-10, 2 = 11-25, 3 = 26-100, 4 = 101-200, 5 = 201-500, 6 = More than 500"
    encoding: ordinal
    justification: >
      The standard PISA proxy for home educational and cultural resources and
      the single strongest questionnaire correlate of achievement in most
      systems. The submitted manuscript described this item as "availability
      of education materials in the home" (main.tex:433).

  # ---------------------------------------------------------------------
  # (iv) Digital-safety judgement -- ST166 (ordinal 1-6)
  #      Used in the submitted analysis. Retained, correctly characterised.
  # ---------------------------------------------------------------------
  ST166Q01HA:
    block: ST166
    label: "Answer the email and ask for more information about the smartphone"
    scale: "1 = Not appropriate at all ... 6 = Very appropriate (REVERSE-scored)"
    encoding: ordinal
    justification: >
      Judgement about responding to a phishing email. Endorsement indicates
      poorer digital-safety judgement. NOT a device-ownership or
      internet-access measure, contrary to main.tex:433.
  ST166Q02HA:
    block: ST166
    label: "Check the sender's email address"
    scale: "1 = Not appropriate at all ... 6 = Very appropriate"
    encoding: ordinal
    justification: "Judgement about verifying sender identity; digital-safety reasoning."
  ST166Q03HA:
    block: ST166
    label: "Click on the link to fill out the form as soon as possible"
    scale: "1 = Not appropriate at all ... 6 = Very appropriate (REVERSE-scored)"
    encoding: ordinal
    justification: "Judgement about following an unverified link; endorsement indicates poorer judgement."
  ST166Q04HA:
    block: ST166
    label: "Delete the email without clicking on the link"
    scale: "1 = Not appropriate at all ... 6 = Very appropriate"
    encoding: ordinal
    justification: "Judgement about avoiding an unverified link."
  ST166Q05HA:
    block: ST166
    label: "Check the website of the mobile phone operator to see whether the smartphone offer is mentioned"
    scale: "1 = Not appropriate at all ... 6 = Very appropriate"
    encoding: ordinal
    justification: "Judgement about independent corroboration; digital-safety reasoning."

  # ---------------------------------------------------------------------
  # (v) Demographic background
  # ---------------------------------------------------------------------
  ST004D01T:
    block: ST004
    label: "Student (Standardized) Gender"
    scale: "1 = Female, 2 = Male (authoritative coding from the SPSS value labels)"
    encoding: one_hot
    justification: >
      Sex is a persistent correlate of mathematics performance in PISA and is
      required for any equity-oriented interpretation. Included as a covariate,
      not as an intervention target.
  ST019AQ01T:
    block: ST019
    label: "Country of birth -- You (student)"
    scale: "Recoded in the released database to 1 = Country of test, 2 = Other country"
    encoding: one_hot
    justification: "Immigrant background of the student; standard PISA equity covariate."
  ST019BQ01T:
    block: ST019
    label: "Country of birth -- Mother"
    scale: "Recoded in the released database to 1 = Country of test, 2 = Other country"
    encoding: one_hot
    justification: "Immigrant background of the household."
  ST019CQ01T:
    block: ST019
    label: "Country of birth -- Father"
    scale: "Recoded in the released database to 1 = Country of test, 2 = Other country"
    encoding: one_hot
    justification: "Immigrant background of the household."

# ===========================================================================
# SCHOOL-LEVEL PREDICTORS -- SCAFFOLDED, NOT YET ACTIVE
#
# The author has approved merging the school questionnaire (CY07_MSU_SCH_QQQ)
# on CNTSCHID. School variables are NOT yet allowlisted because we do not have
# a documentary source for their labels and coding: the file supplied is a CSV
# with no SPSS value-label metadata, and the school questionnaire instrument
# PDF has not been provided.
#
# Adding an item here without a citation would repeat exactly the defect the
# editor objected to in comment 7. To activate this section, supply either
#   (a) CY07_MSU_SCH_QQQ.sav, so codebook.py can read the value labels, or
#   (b) the PISA 2018 School Questionnaire PDF, for scripts/build_codebook.py.
#
# NOTE ON LEAKAGE: school-level aggregates require care. Any school-mean
# achievement variable is outcome-derived and must be forbidden. Because
# CNTSCHID is the CV grouping variable, school-constant predictors are
# constant within a fold, which is legitimate but changes the interpretation
# of the transfer results.
# ===========================================================================
school_predictors: {}
school_predictors_status: blocked_pending_documentation
