# =====================================================================
# VLPSO-XAI / PISA 2018 -- full-budget configuration
#
# Every number the analysis depends on lives here. Nothing is hard-coded
# in src/. Changing this file changes the analysis; the file's SHA256 is
# recorded in results/manifest.json for every artefact produced.
#
# Compute scope: TIERED (author decision, 2026-07-25).
#   Primary specification  -> full budget (10 PVs, 10 seeds, 100 perms)
#   Selector sweep         -> reduced PV/seed budget, documented in
#                             CHANGELOG_REVISION.md and the manuscript.
# =====================================================================

meta:
  name: quick
  description: Reduced-budget smoke test. NOT for publication numbers.
  revision_of: "An Explainable AI Framework for Student Performance Prediction (Applied System Innovation)"

paths:
  root: null            # null => resolve from env / Drive / repo root

# ---------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------
data:
  cycle: 2018           # AUTHOR DECISION: code is 2018; main.tex:433 said 2022 and is WRONG.
  cycle_note: >
    The manuscript stated PISA 2022 at main.tex:433 while the code read
    CY07_MSU_STU_QQQ.sav, which is the PISA 2018 student questionnaire.
    The author confirmed 2018 is correct; the manuscript text is corrected.

  source:
    student_zip_url: https://webfs.oecd.org/pisa2018/SPSS_STU_QQQ.zip
    school_zip_url:  https://webfs.oecd.org/pisa2018/SPSS_SCH_QQQ.zip
    student_sav: CY07_MSU_STU_QQQ.sav
    school_sav:  CY07_MSU_SCH_QQQ.sav
    landing_page: https://www.oecd.org/en/data/datasets/pisa-2018-database.html
    # Filled in by ingest.py on first download and asserted on every later run.
    student_zip_sha256: null
    school_zip_sha256: null
    access_date: null

  primary_country: ESP          # Spain. Never stated in the original manuscript.
  external_countries: [PRT]     # AUTHOR DECISION: Portugal as external test set.
  merge_school_questionnaire: true   # AUTHOR DECISION: merge SCH file on CNTSCHID.

  # Row exclusion. The original rule (drop rows with >400 missing columns)
  # is retained as primary so the revision is comparable, but it was never
  # justified, so we report sensitivity at two alternatives.
  missing_row_threshold: 400
  missing_row_threshold_sensitivity: [200, 600]

  # Item-level missingness ceiling for a predictor to remain a candidate.
  max_item_missing_fraction: 0.30

# ---------------------------------------------------------------------
# Outcome: plausible values and proficiency cut points
# ---------------------------------------------------------------------
outcome:
  domain: MATH
  n_plausible_values: 1
  pv_template: "PV{i}MATH"

  # Official PISA 2018 mathematics proficiency level lower bounds, in PISA
  # score points. Source: OECD (2019), PISA 2018 Results Volume I, Annex A1;
  # PISA 2018 Technical Report Chapter 15.
  # Verify against the cited source before publication (see codebook.py).
  proficiency_bounds:
    level_1a: 357.77
    level_2:  420.07
    level_3:  482.38
    level_4:  544.68
    level_5:  606.99
    level_6:  669.30

  # Three-category collapse used by the paper.
  #   Low    = below Level 3            (< 482.38)
  #   Medium = Levels 3 and 4           ([482.38, 606.99))
  #   High   = Levels 5 and 6           (>= 606.99)
  # The original code used 482 and 607 (data_preparation.py:168-173), which
  # misassigns students in [482, 482.38) and [606.99, 607].
  category_cuts: [482.38, 606.99]
  category_labels: [Low, Medium, High]

  tasks:
    low_vs_medium:  {negative: Low,    positive: Medium}
    medium_vs_high: {negative: Medium, positive: High}
    low_vs_high:    {negative: Low,    positive: High}

  # Rubin's rules combination across the M plausible values.
  rubin:
    m: 10
    report_variance_decomposition: true   # within, between, and total

# ---------------------------------------------------------------------
# Complex survey design
# ---------------------------------------------------------------------
design:
  final_weight: W_FSTUWT
  replicate_weight_template: "W_FSTURWT{r}"
  n_replicates: 80
  brr_fay_factor: 0.5          # PISA uses Fay's BRR with k = 0.5
  psu: CNTSCHID                # schools are the primary sampling units
  stratum: STRATUM
  # Weighted metrics are reported alongside unweighted ones, never instead.
  report_weighted_metrics: true
  report_unweighted_metrics: true

# ---------------------------------------------------------------------
# Cross-validation. Answers editor comment 1.
# ---------------------------------------------------------------------
cv:
  outer_splits: 3
  outer_repeats: 1
  inner_splits: 2
  group_column: CNTSCHID       # students from one school never straddle a fold
  stratify: true
  scoring: roc_auc
  threshold_metric: balanced_accuracy   # selected on INNER folds only
  class_balance: class_weight            # not global undersampling

# ---------------------------------------------------------------------
# Feature selection
# ---------------------------------------------------------------------
selection:
  methods:
    - none
    - chi2
    - mutual_info
    - symmetric_uncertainty
    - relieff
    - rfe
    - sfs
    - l1_logistic
    - tree_importance
    - boruta
    - bpso
    - vlpso
  k_filter: [5, 10, 15, 20, 30]   # tuned on inner folds

  vlpso:
    # AUTHOR DECISION (Stage 7): Path A -- genuine variable-length PSO.
    representation: index_list      # variable-length list of feature indices
    population_size: 10
    divisions: 12
    max_iter: 8
    inertia_start: 0.9
    inertia_end: 0.4
    c1: 1.49445
    c2: 1.49445
    beta_stagnation: 9              # iterations without improvement -> length adaptation
    gamma_accuracy: 0.8             # weight on the performance term
    length_penalty: 0.15            # feature-count penalty (was ABSENT in the original code)
    interpretability_weight: 0.05   # third objective term
    k_neighbors: 5
    min_length: 2
    max_length: null                # null => n_features
    growth_prob: 0.5                # P(grow) vs P(shrink) at an adaptation event
    length_step: 1
    convergence_tol: 1.0e-6
    convergence_patience: 4        # stopping criterion (the original had none)
    direction: maximize             # stated explicitly; the original never said
    ranking: symmetric_uncertainty  # AUTHOR DECISION: real SU, not mutual_info
    init: ranked                    # 'ranked' (SU-seeded) or 'random'
    fitness_cv_splits: 3            # internal CV -- never resubstitution

  bpso:
    # Matched to VLPSO on EVERY parameter except the length mechanism.
    population_size: 10
    max_iter: 8
    inertia_start: 0.9
    inertia_end: 0.4
    c1: 1.49445
    c2: 1.49445
    k_neighbors: 5
    fitness_cv_splits: 3
    fixed_cardinalities: [5, 10, 15, 20, 30]

  ablations:
    variable_length_off: true
    symmetric_uncertainty_off: true    # SU -> mutual information
    objective_terms: [accuracy, length_penalty, interpretability]
    initialisation: [ranked, random]
    length_direction: [both, shrink_only, grow_only]

  stability:
    consensus_threshold: 0.80      # selected in >= 80% of folds
    indices: [jaccard, kuncheva]

# ---------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------
models:
  primary: [GradientBoosting, RandomForest, LogisticRegression_L2]
  all:
    - LogisticRegression_L1
    - LogisticRegression_L2
    - DecisionTree
    - RandomForest
    - GradientBoosting
    - SVM
    - LinearSVC
    - XGBoost
    - MLP
    - LightGBM

# ---------------------------------------------------------------------
# Statistical validation. Answers editor comments 4 and 6.
# ---------------------------------------------------------------------
statistics:
  bootstrap:
    n_resamples: 100
    method: BCa
    cluster_on: CNTSCHID      # resample schools, not students
    alpha: 0.05
  permutation:
    n_permutations: 5       # primary specification
    n_permutations_secondary: 3
    expected_auc: 0.50
    tolerance: 0.03           # Stage 10 check 3
  multiplicity:
    method: holm              # holm | benjamini_hochberg
    family: per_task
  effect_size:
    paired_test: nadeau_bengio   # corrected resampled t for overlapping CV folds
    thresholds: {negligible: 0.2, small: 0.5, medium: 0.8}

# ---------------------------------------------------------------------
# Explainability. Answers editor comment 7.
# ---------------------------------------------------------------------
explain:
  global_shap:
    n_instances: 100         # >= 1000 stratified test instances
    stratify_by: label
    bootstrap_resamples: 50
    background_size: 200
    background_source: train  # NEVER test
    background_method: kmeans
  local_shap:
    n_instances: 12
    selection: stratified_quantile   # documented, not argmax/argmin
  lime:
    n_instances: 12
    n_repeats: 3             # stochasticity -> stability reported
    n_samples: 500
    n_features: 15
  output_scale: log_odds      # stated once, used consistently
  noise_control:
    enabled: true
    role: negative_control    # excluded from the allowlist; diagnostic runs only

# ---------------------------------------------------------------------
# Reproducibility
# ---------------------------------------------------------------------
reproducibility:
  master_seed: 42
  n_seeds: 2                 # >= 10 distinct seeds (editor comment 4)
  checkpoint: true
  checkpoint_format: parquet
  manifest: true

compute:
  n_jobs: -1
  budget_tier: tiered
  primary_task: low_vs_high
  # Reduced budget applied outside the primary specification.
  reduced:
    n_plausible_values: 3
    n_seeds: 3
    permutations: 30
