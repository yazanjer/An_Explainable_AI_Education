name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.10"}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn pyyaml pyarrow pytest
      - name: Test suite (synthetic data only, no PISA microdata)
        run: pytest tests/ -q
        env:
          VLPSO_PROJECT_ROOT: ${{ github.workspace }}
      - name: Leakage guard must raise
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "src")
          import pandas as pd
          from vlpso_xai.data.features import assert_no_leakage, LeakageError
          for col in ("math_score", "PV3MATH", "W_FSTUWT", "STRATUM_ESP9033"):
              try:
                  assert_no_leakage(pd.DataFrame({"ST013Q01TA":[1.0], col:[1.0]}), where="ci")
              except LeakageError:
                  continue
              raise SystemExit(f"guard failed to raise for {col}")
          print("leakage guard OK")
          PY
